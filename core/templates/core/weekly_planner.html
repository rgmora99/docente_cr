{% extends 'core/base.html' %}
{% block title %}Planificador | Docente CR{% endblock %}
{% block content %}
<h1 class="fw-bold mb-3">Planificador</h1>
<p class="text-muted mb-4">Vista diaria, semanal y mensual para organizar tus lecciones por planeación.</p>

<div class="card border-0 shadow-sm rounded-4 planner-board" id="plannerBoard">
  <div class="card-body p-3 p-lg-4">
    <div class="row g-3 align-items-end mb-3">
      <div class="col-lg-7">
        <label class="form-label fw-semibold" for="plannerProfileSelect">Planeación</label>
        <select class="form-select rounded-3" id="plannerProfileSelect"></select>
      </div>
      <div class="col-lg-5">
        <a href="{% url 'teacher_profiles' %}" class="btn btn-outline-primary rounded-pill w-100"><i class="bi bi-gear me-2"></i>Administrar planeaciones</a>
      </div>
    </div>

    <div class="planner-selected-profile rounded-3 px-3 py-2 mb-3" id="plannerSelectedProfileSummary"></div>

    <div class="planner-toolbar d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <button class="btn btn-outline-light planner-dark-btn" type="button" id="plannerTodayBtn">Hoy</button>
        <button class="btn btn-outline-light planner-dark-btn" type="button" id="plannerPrevBtn"><i class="bi bi-chevron-left"></i></button>
        <button class="btn btn-outline-light planner-dark-btn" type="button" id="plannerNextBtn"><i class="bi bi-chevron-right"></i></button>
        <h5 class="fw-bold mb-0 ms-2" id="plannerRangeLabel"></h5>
      </div>
      <div class="planner-view-select-wrap">
        <label class="visually-hidden" for="plannerViewSelect">Vista</label>
        <select class="form-select" id="plannerViewSelect">
          <option value="day">Día</option>
          <option value="workweek" selected>Semana laboral</option>
          <option value="week">Semana</option>
          <option value="month">Mes</option>
          <option value="agenda">Vista programación</option>
        </select>
      </div>
    </div>

    <div id="plannerViewContainer"></div>
  </div>
</div>
{% endblock %}
