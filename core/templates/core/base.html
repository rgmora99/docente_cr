{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Docente CR{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'core/css/styles.css' %}" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  {% if request.user.is_authenticated %}
  <aside class="sidebar d-flex flex-column p-4">
    <h4 class="fw-bold text-primary"><i class="bi bi-journal-check me-2"></i>Docente CR</h4>
    <nav class="nav flex-column mt-4 gap-2">
      <a class="nav-link" href="{% url 'dashboard' %}"><i class="bi bi-grid me-2"></i>Dashboard</a>
      <a class="nav-link" href="{% url 'weekly_planner' %}"><i class="bi bi-calendar-week me-2"></i>Planificador semanal</a>
      <a class="nav-link" href="{% url 'planning_generator' %}"><i class="bi bi-pencil-square me-2"></i>Planeamientos</a>
      <a class="nav-link" href="{% url 'materials' %}"><i class="bi bi-folder2-open me-2"></i>Materiales</a>
    </nav>
    <form action="{% url 'logout' %}" method="post" class="mt-auto">
      {% csrf_token %}
      <button class="btn btn-outline-danger w-100 rounded-pill" type="submit"><i class="bi bi-box-arrow-left me-2"></i>Cerrar sesión</button>
    </form>
  </aside>
  {% endif %}

  <main class="content-area p-4 p-md-5">
    {% block content %}{% endblock %}
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'core/js/app.js' %}"></script>
</body>
</html>
