{% extends 'core/base.html' %}
{% block title %}Iniciar sesión | Docente CR{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-lg rounded-4 fade-in-up">
        <div class="card-body p-4 p-md-5">
          <h2 class="fw-bold mb-1">Bienvenido</h2>
          <p class="text-muted mb-4">Accede a tu sistema docente.</p>
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Usuario</label>
              <input type="text" name="username" class="form-control rounded-3" required>
            </div>
            <div class="mb-4">
              <label class="form-label">Contraseña</label>
              <input type="password" name="password" class="form-control rounded-3" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2">Ingresar</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
